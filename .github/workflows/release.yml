name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'codex/release-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Resolve version tag
        id: target
        shell: bash
        env:
          TARGET_REF: ${{ inputs.tag || github.event.ref || github.ref_name }}
        run: |
          tag="${TARGET_REF#refs/tags/}"
          tag="${tag#refs/heads/}"
          tag="${tag#codex/release-}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ steps.target.outputs.tag }}
          persist-credentials: false
      - name: Record verified source
        id: source
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
      - name: Build embedded frontend
        run: |
          pnpm --dir web typecheck
          pnpm --dir web build
      - name: Backend release checks
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
      - name: Browser release checks
        run: |
          pnpm --dir web exec playwright test --grep-invert 'first run, invite, collaborative Markdown, whiteboard and export'
          pnpm --dir web exec playwright test mvp.spec.ts
          pnpm --dir web exec playwright test --config playwright.restart.config.ts
          git diff --exit-code HEAD
      - name: Retain failure traces
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-test-failure
          path: web/test-results
          if-no-files-found: ignore

  publish:
    needs: verify
    concurrency:
      group: publish-${{ needs.verify.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Validate release metadata
        id: release
        shell: bash
        env:
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$VERIFIED_COMMIT"
          test -f "docs/releases/$RELEASE_TAG.md"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > /tmp/released-tags.txt
          if grep -Fxq "$RELEASE_TAG" /tmp/released-tags.txt; then
            printf 'Release already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build standalone archives
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir web build
          export ARTIFACT_DIR="$RUNNER_TEMP/madoc-release-artifacts"
          printf 'ARTIFACT_DIR=%s\n' "$ARTIFACT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$ARTIFACT_DIR"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            directory="madoc-${RELEASE_TAG}-${os}-${arch}"
            test -z "$(git status --porcelain)"
            mkdir -p "$ARTIFACT_DIR/$directory"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "$ARTIFACT_DIR/$directory/madoc" .
            cp BUILD.md README.md "$ARTIFACT_DIR/$directory/"
            cp -r docs "$ARTIFACT_DIR/$directory/docs"
            tar -C "$ARTIFACT_DIR" -czf "$ARTIFACT_DIR/$directory.tar.gz" "$directory"
            rm -r "$ARTIFACT_DIR/$directory"
          done
          (cd "$ARTIFACT_DIR" && sha256sum *.tar.gz > SHA256SUMS)
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: madoc-release:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify production persistence
        run: python3 scripts/docker-smoke.py madoc-release:candidate
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.image }}:${{ needs.verify.outputs.tag }}
          labels: |
            org.opencontainers.image.title=Madoc
            org.opencontainers.image.description=Self-hosted collaborative Markdown and whiteboard workspace
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.commit }}
            org.opencontainers.image.version=${{ needs.verify.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish GitHub Release
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "$ARTIFACT_DIR/IMAGE_DIGEST"
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "$ARTIFACT_DIR"/* --verify-tag --title "Madoc $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" "${flags[@]}"
